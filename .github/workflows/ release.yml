name: Release

# Triggers when a tag v* is created on main
on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Archive files
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: "powerbi-on-databricks-migration-accelerator-${{ github.ref_name }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig .git/**'

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            powerbi-on-databricks-migration-accelerator-${{ github.ref_name }}.zip
            
